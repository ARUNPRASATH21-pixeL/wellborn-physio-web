spring.application.name=wellborn

# ===============================
# SERVER
# ===============================
server.address=0.0.0.0
server.port=${PORT:10000}


# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://mysql-39edb517-arunprasath31283-a78a.a.aivencloud.com:23986/defaultdb?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=avnadmin
spring.datasource.password=${WELLBORN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN


# ===============================
# JWT
# ===============================
wellborn.jwt.secret=${WELLBORN_JWT_SECRET}


# ===============================
# FRONTEND
# ===============================
wellborn.frontend.url=${WELLBORN_FRONTEND_URL:http://localhost:5173}


# ===============================
# RESEND EMAIL
# ===============================
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL}


# ===============================
# DATABASE CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# ===============================
# ADMIN SIGNUP SECRET CODE
# ===============================
wellborn.admin.signup.secret-code=${WELLBORN_ADMIN_SIGNUP_SECRET_CODE}


# ===============================
# FIREBASE FCM
# ===============================
firebase.service-account=classpath:firebase-service-account.json


# ===============================
# WEB PUSH VAPID
# ===============================
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT}